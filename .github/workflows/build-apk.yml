name: Build WaniTerminal APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper & Properties
        working-directory: WaniTerminal
        run: |
          # Ensure gradle wrapper exists
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          
          # Forcefully write AndroidX properties into gradle.properties
          echo "" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK with Gradle
        working-directory: WaniTerminal
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaniTerminal-Debug-APK
          path: WaniTerminal/app/build/outputs/apk/debug/app-debug.apk
          
